<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Ideias de Jogos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <main class="app-shell">
      <section class="panel controls-panel">
        <div class="panel-header">
          <p class="eyebrow">IAgameshub</p>
          <h1>Gerador de Ideias</h1>
        </div>

        <div class="section-block">
          <label class="section-label">Estilo visual</label>
          <div class="style-select" id="styleSelect">
            <button class="style-option active" type="button" data-value="2D">2D</button>
            <button class="style-option" type="button" data-value="3D">3D</button>
            <button class="style-option" type="button" data-value="2.5D">2.5D</button>
          </div>
        </div>

        <div class="section-block">
          <label for="genreSelect" class="section-label">Gênero</label>
          <select id="genreSelect">
            <option value="Ação">Ação</option>
            <option value="Aventura">Aventura</option>
            <option value="RPG">RPG</option>
            <option value="Estratégia">Estratégia</option>
            <option value="Puzzle">Puzzle</option>
            <option value="Plataforma">Plataforma</option>
            <option value="Tiro">Tiro</option>
            <option value="Simulação">Simulação</option>
            <option value="Horror">Horror</option>
            <option value="Casual">Casual</option>
            <option value="Personalizado">Personalizado</option>
          </select>
        </div>

        <div id="genreCustomWrap" class="section-block hidden">
          <label for="genreCustom" class="section-label">Gênero personalizado</label>
          <input id="genreCustom" type="text" placeholder="Ex.: Roguelite de sobrevivência" />
        </div>

        <div class="section-block">
          <label for="topicSelect" class="section-label">Tema principal</label>
          <select id="topicSelect">
            <option value="Futurismo urbano com robôs">Futurismo urbano com robôs</option>
            <option value="Piratas em um mundo submerso">Piratas em um mundo submerso</option>
            <option value="Magia e criaturas ancestrais">Magia e criaturas ancestrais</option>
            <option value="Exploração espacial em planetas desconhecidos">Exploração espacial em planetas desconhecidos</option>
            <option value="Sobrevivência em uma floresta encantada">Sobrevivência em uma floresta encantada</option>
            <option value="Personalizado">Personalizado</option>
          </select>
        </div>

        <div id="topicCustomWrap" class="section-block hidden">
          <label for="topicCustom" class="section-label">Tema personalizado</label>
          <input id="topicCustom" type="text" placeholder="Ex.: uma cidade flutuante em disputa" />
        </div>

        <div class="actions">
          <button id="generateBtn" class="primary-btn" type="button">Gerar prompt</button>
          <button id="copyBtn" class="ghost-btn" type="button">Copiar</button>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="output-head">
          <div>
            <p class="eyebrow muted">Prompt pronto</p>
            <h2>Ideia de jogo</h2>
          </div>
          <span id="badge" class="badge">Novo</span>
        </div>

        <textarea id="output" readonly aria-label="Prompt gerado"></textarea>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
