<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Pong</h1>

      <div class="hud">
        <div class="score-box">
          <span>Jogador 1</span>
          <strong id="score-left">0</strong>
        </div>

        <div class="score-box">
          <span>Jogador 2</span>
          <strong id="score-right">0</strong>
        </div>
      </div>

      <canvas id="pongCanvas" width="900" height="500" aria-label="Canvas do jogo Pong"></canvas>

      <div class="controls">
        <div class="controls-text">
          <p>Jogador 1: W / S</p>
          <p>Jogador 2: ↑ / ↓</p>
        </div>

        <div class="buttons">
          <button id="startBtn" type="button">Iniciar</button>
          <button id="resetBtn" type="button" class="secondary">Reiniciar</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
