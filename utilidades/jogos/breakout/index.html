<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakout</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Breakout</h1>

      <div class="hud">
        <div class="score-box">
          <span>Pontos</span>
          <strong id="score">0</strong>
        </div>

        <div class="score-box">
          <span>Vidas</span>
          <strong id="lives">3</strong>
        </div>
      </div>

      <canvas id="breakoutCanvas" width="720" height="480" aria-label="Canvas do jogo Breakout"></canvas>

      <div class="controls">
        <div class="controls-text">
          <p>Setas ou A / D</p>
        </div>

        <div class="buttons">
          <button id="startBtn" type="button">Iniciar</button>
          <button id="resetBtn" type="button" class="secondary">Reiniciar</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
