<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Velha IA</title>
    <style>
      :root {
        --bg: #020817;
        --panel: #0f172a;
        --panel-2: #111827;
        --line: rgba(148, 163, 184, 0.32);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #38bdf8;
        --warning: #facc15;
        --success: #4ade80;
        --danger: #f87171;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #172554, var(--bg) 55%);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-shell {
        width: min(560px, 92vw);
        background: rgba(15, 23, 42, 0.96);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 30px 60px rgba(2, 6, 23, 0.55);
        padding: 24px 20px 18px;
      }

      h1 {
        margin: 0 0 18px;
        text-align: center;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(3, minmax(90px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .score-box {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 10px;
        text-align: center;
      }

      .score-box span {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .score-box strong {
        font-size: clamp(1.5rem, 4vw, 2.2rem);
      }

      .status-box {
        margin-bottom: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(148, 163, 184, 0.06);
        text-align: center;
        font-weight: 700;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .cell {
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(17, 24, 39, 0.9);
        color: var(--text);
        font-size: clamp(2rem, 7vw, 3.2rem);
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }

      .cell:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: rgba(56, 189, 248, 0.8);
      }

      .cell:disabled {
        cursor: default;
      }

      .controls {
        margin-top: 18px;
        display: flex;
        justify-content: center;
      }

      button {
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary), #0ea5e9);
        color: #082f49;
        font-weight: 700;
        padding: 10px 18px;
        cursor: pointer;
      }

      .secondary {
        background: rgba(59, 130, 246, 0.12);
        color: var(--text);
        border: 1px solid rgba(96, 165, 250, 0.35);
      }

      @media (max-width: 450px) {
        .scoreboard {
          grid-template-columns: repeat(3, minmax(70px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <h1>Jogo da Velha</h1>

      <div class="scoreboard">
        <div class="score-box">
          <span>Você</span>
          <strong id="player-score">0</strong>
        </div>

        <div class="score-box">
          <span>Empates</span>
          <strong id="draw-score">0</strong>
        </div>

        <div class="score-box">
          <span>Bot</span>
          <strong id="bot-score">0</strong>
        </div>
      </div>

      <div id="status" class="status-box">Sua vez: X</div>

      <div class="board" id="board" aria-label="Tabuleiro do Jogo da Velha">
        <button class="cell" data-index="0" aria-label="Casa 1"></button>
        <button class="cell" data-index="1" aria-label="Casa 2"></button>
        <button class="cell" data-index="2" aria-label="Casa 3"></button>
        <button class="cell" data-index="3" aria-label="Casa 4"></button>
        <button class="cell" data-index="4" aria-label="Casa 5"></button>
        <button class="cell" data-index="5" aria-label="Casa 6"></button>
        <button class="cell" data-index="6" aria-label="Casa 7"></button>
        <button class="cell" data-index="7" aria-label="Casa 8"></button>
        <button class="cell" data-index="8" aria-label="Casa 9"></button>
      </div>

      <div class="controls">
        <button id="restartBtn" class="secondary" type="button">Reiniciar</button>
      </div>
    </div>

    <script>
      const cells = Array.from(document.querySelectorAll('.cell'));
      const statusEl = document.getElementById('status');
      const playerScoreEl = document.getElementById('player-score');
      const drawScoreEl = document.getElementById('draw-score');
      const botScoreEl = document.getElementById('bot-score');
      const restartBtn = document.getElementById('restartBtn');

      const state = {
        board: Array(9).fill(''),
        player: 'X',
        bot: 'O',
        currentTurn: 'X',
        scores: {
          player: 0,
          draw: 0,
          bot: 0,
        },
        gameOver: false,
      };

      function updateScoreboard() {
        playerScoreEl.textContent = String(state.scores.player);
        drawScoreEl.textContent = String(state.scores.draw);
        botScoreEl.textContent = String(state.scores.bot);
      }

      function updateStatus(message) {
        statusEl.textContent = message;
      }

      function resetBoard() {
        state.board = Array(9).fill('');
        state.currentTurn = 'X';
        state.gameOver = false;

        cells.forEach((cell) => {
          cell.textContent = '';
          cell.disabled = false;
        });

        updateStatus('Sua vez: X');
      }

      function checkWinner(board) {
        const lines = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6],
        ];

        for (const [a, b, c] of lines) {
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return board[a];
          }
        }

        return null;
      }

      function finishRound(winner) {
        state.gameOver = true;

        cells.forEach((cell) => {
          cell.disabled = true;
        });

        if (winner === 'X') {
          state.scores.player += 1;
          updateStatus('Você venceu!');
        } else if (winner === 'O') {
          state.scores.bot += 1;
          updateStatus('O bot venceu!');
        } else {
          state.scores.draw += 1;
          updateStatus('Empate!');
        }

        updateScoreboard();
      }

      function isBoardFull(board) {
        return board.every((cell) => cell !== '');
      }

      function canPlay(index) {
        return !state.gameOver && state.board[index] === '' && state.currentTurn === 'X';
      }

      function makePlayerMove(index) {
        if (!canPlay(index)) return;

        state.board[index] = 'X';
        cells[index].textContent = 'X';
        cells[index].disabled = true;

        const winner = checkWinner(state.board);
        if (winner) {
          finishRound(winner);
          return;
        }

        if (isBoardFull(state.board)) {
          finishRound(null);
          return;
        }

        state.currentTurn = 'O';
        updateStatus('Turno do bot...');
        setTimeout(makeBotMove, 500);
      }

      function getBestMove(board) {
        const winningLines = [
          [0, 1, 2],
          [3, 4, 5],
          [6, 7, 8],
          [0, 3, 6],
          [1, 4, 7],
          [2, 5, 8],
          [0, 4, 8],
          [2, 4, 6],
        ];

        for (const [a, b, c] of winningLines) {
          if (board[a] === 'O' && board[b] === 'O' && board[c] === '') return c;
          if (board[a] === 'O' && board[c] === 'O' && board[b] === '') return b;
          if (board[b] === 'O' && board[c] === 'O' && board[a] === '') return a;
        }

        for (const [a, b, c] of winningLines) {
          if (board[a] === 'X' && board[b] === 'X' && board[c] === '') return c;
          if (board[a] === 'X' && board[c] === 'X' && board[b] === '') return b;
          if (board[b] === 'X' && board[c] === 'X' && board[a] === '') return a;
        }

        const center = 4;
        if (board[center] === '') return center;

        const corners = [0, 2, 6, 8].filter((index) => board[index] === '');
        if (corners.length > 0) return corners[0];

        return board.findIndex((cell) => cell === '');
      }

      function makeBotMove() {
        if (state.gameOver) return;

        const move = getBestMove(state.board);
        if (move === -1) return;

        state.board[move] = 'O';
        cells[move].textContent = 'O';
        cells[move].disabled = true;

        const winner = checkWinner(state.board);
        if (winner) {
          finishRound(winner);
          return;
        }

        if (isBoardFull(state.board)) {
          finishRound(null);
          return;
        }

        state.currentTurn = 'X';
        updateStatus('Sua vez: X');
      }

      cells.forEach((cell) => {
        cell.addEventListener('click', () => {
          const index = Number(cell.dataset.index);
          makePlayerMove(index);
        });
      });

      restartBtn.addEventListener('click', () => {
        resetBoard();
        updateScoreboard();
      });

      updateScoreboard();
      resetBoard();
    </script>
  </body>
</html>
