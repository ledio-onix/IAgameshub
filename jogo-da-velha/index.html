<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo da Velha IA</title>
    <link rel="preload" href="../assets/x.svg" as="image" />
    <link rel="preload" href="../assets/o.svg" as="image" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="game-shell">
      <h1>Jogo da Velha</h1>

      <div class="scoreboard">
        <div class="score-box">
          <span>Você</span>
          <strong id="player-score">0</strong>
        </div>

        <div class="score-box">
          <span>Empates</span>
          <strong id="draw-score">0</strong>
        </div>

        <div class="score-box">
          <span>Bot</span>
          <strong id="bot-score">0</strong>
        </div>
      </div>

      <div id="status" class="status-box">Sua vez: X</div>

      <div class="board" id="board" aria-label="Tabuleiro do Jogo da Velha">
        <button class="cell" data-index="0" aria-label="Casa 1"></button>
        <button class="cell" data-index="1" aria-label="Casa 2"></button>
        <button class="cell" data-index="2" aria-label="Casa 3"></button>
        <button class="cell" data-index="3" aria-label="Casa 4"></button>
        <button class="cell" data-index="4" aria-label="Casa 5"></button>
        <button class="cell" data-index="5" aria-label="Casa 6"></button>
        <button class="cell" data-index="6" aria-label="Casa 7"></button>
        <button class="cell" data-index="7" aria-label="Casa 8"></button>
        <button class="cell" data-index="8" aria-label="Casa 9"></button>
      </div>

      <div class="controls">
        <button id="restartBtn" class="secondary" type="button">Reiniciar</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
